# vpype-gcode profile template (REFERENCE ONLY).
#
# ⚠️ ACTUAL ~/.vpype.toml is auto-generated by scripts/svg_to_gcode.py
#    with Z_PEN_DOWN and Z_HOP values substituted from the script's constants.
#
# This file is kept as documentation of the profile structure.
# To change Z-offset calibration, edit Z_PEN_DOWN / Z_HOP in svg_to_gcode.py
# and re-run; ~/.vpype.toml will be regenerated.

[gwrite.bambu_p1s_umts]
unit = "mm"
vertical_flip = false              # Y orientation handled in pipeline (scale 1 -1)
document_start = ""                # wrapper added by merge_pages.py
document_end = ""
layer_start = ""
layer_end = ""
line_start = ""
# Z values below are PLACEHOLDERS — replaced at runtime with absolute nozzle Z:
#   pen down = Z_PEN_DOWN          (e.g. 18.0 mm = pen tip touches paper)
#   pen up   = Z_PEN_DOWN + Z_HOP  (e.g. 21.0 mm = nozzle 21mm above bed)
segment_first = "G0 X{x:.3f} Y{y:.3f} F18000\nG1 Z<Z_PEN_DOWN> F1200\n"
segment       = "G1 X{x:.3f} Y{y:.3f} F12000\n"
line_end      = "G1 Z<Z_PEN_DOWN+Z_HOP> F1200\n"
info = "Bambu Lab P1S + UMTS pen plotter. F12000=200mm/s draw, F18000=300mm/s travel."
